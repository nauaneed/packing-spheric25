<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/best.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section> <!-- First Slide -->
					<div style="text-align: center;">
						<h1> Rapid Variable Resolution </br> Particle Initialization with SPH </h1> 
						<h2> Prabhu Ramachandran </h2>
						</br>  </br>  </br>  </br> 
						
						Navaneet Villodi and Prabhu Ramachandran </br> 
						Department of Aerospace Engineering </br> 
						IITB
					</div>
				</section>
				<section data-auto-animate> 
					<h3> <code>PySPH</code> </h3>
					<p><em>Framework for Smoothed Particle Hydrodynamics (SPH) simulations.</em></p> 
					<h3>3D Body: Simplified Apollo Reentry Module</h3>
					<div style="display: flex;text-align: center; ">
						<div style="flex: 1; padding: 10px;">
							<iframe src="./assets/apollo.html" width="700" height="700" frameborder="20" title="content"></iframe>
						</div>
					</div>
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script src="plugin/math/math.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,
				width: 1920,
  				height: 1080,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealMath, RevealHighlight ]
			});

		</script>
	</body>
</html>
